<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>一乗寺</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Noto+Sans+JP:wght@300;400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#f0ece4}
body{font-family:'Noto Sans JP',sans-serif}

#map{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1}

.leaflet-tile-pane{
  filter:grayscale(1) brightness(1.45) contrast(0.3);
  opacity:.6;
}

#tint{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;
  background:rgba(240,236,228,.18);
  pointer-events:none;
}

.leaflet-control-zoom{display:none!important}
.leaflet-control-attribution{
  font-size:8px!important;opacity:.25!important;
  background:transparent!important;color:#888!important;
}
.leaflet-control-attribution a{color:#888!important}

.w{
  font-family:'Zen Antique Soft',serif;
  color:#000;
  opacity:0;
  cursor:default;
  white-space:nowrap;
  letter-spacing:4px;
  transition:opacity .8s ease-in,transform .5s;
  transform:scale(1);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6);
  user-select:none;
  -webkit-user-select:none;
}
.w.visible{opacity:.75}
.w rt{
  font-size:.45em;
  letter-spacing:1px;
  opacity:.7;
}
.w.on{
  opacity:1!important;
  transform:scale(1.12);
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(0,0,0,.08);
}
.w.on rt{opacity:1}
.w.local{color:#b22222}
.w.local.on{
  text-shadow:
    0 0 20px rgba(240,236,228,.9),
    0 0 40px rgba(240,236,228,.6),
    0 1px 3px rgba(178,34,34,.12);
}
body.focus .w:not(.on){
  opacity:.18!important;
}

#bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  padding:22px 32px 26px;
  background:linear-gradient(transparent 0%,rgba(26,26,20,.6) 25%,rgba(26,26,20,.82) 100%);
  color:#F0E4C4;
  transform:translateY(100%);
  opacity:0;
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s;
  display:flex;align-items:center;gap:24px;
  pointer-events:none;
}
#bar.show{transform:translateY(0);opacity:1}
#bar .bw{
  font-family:'Zen Antique Soft',serif;
  font-size:28px;letter-spacing:8px;flex-shrink:0;
}
#bar .bw rt{font-size:.45em;letter-spacing:1px}
#bar .bd{
  font-size:14px;line-height:1.8;font-weight:300;
  letter-spacing:.5px;color:rgba(240,228,196,.8);
}

#wm{
  position:fixed;top:18px;left:22px;z-index:100;
  pointer-events:none;transition:opacity .5s;
}
#wm .t1{
  font-family:'Zen Antique Soft',serif;
  font-size:16px;letter-spacing:10px;
  color:rgba(26,26,20,.2);
}
#wm .t1 rt{font-size:.5em;letter-spacing:2px}
#wm .t2{
  font-size:9px;letter-spacing:2px;margin-top:3px;
  color:rgba(26,26,20,.13);font-weight:300;
}
body.focus #wm{opacity:.3}

/* shuffle button */
#shuffle{
  position:fixed;bottom:18px;right:18px;z-index:101;
  width:40px;height:40px;border-radius:50%;
  background:rgba(26,26,20,.08);border:1px solid rgba(26,26,20,.1);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .3s,transform .3s;
  color:rgba(26,26,20,.3);font-size:18px;
}
#shuffle:hover{background:rgba(26,26,20,.15);transform:rotate(180deg)}

/* park zone */
.park-zone{
  border:2px dashed rgba(46,120,56,.70)!important;
  background:rgba(46,120,56,.15)!important;
}
#park-label{
  position:fixed;z-index:50;
  pointer-events:none;
  font-family:'Zen Antique Soft',serif;
  font-size:13px;letter-spacing:4px;
  font-weight:400;
  color:rgba(36,110,46,.6);
  text-shadow:0 0 8px rgba(255,255,255,.7);
  text-align:center;
  white-space:nowrap;
}

/* dragging state */
.w.dragging{
  opacity:1!important;
  transform:scale(1.15);
  cursor:grabbing;
  z-index:9999;
}
.leaflet-marker-icon{cursor:grab}
.leaflet-dragging .leaflet-marker-icon{cursor:grabbing}

/* absorb animation */
.w.absorbing{
  transition:transform .6s cubic-bezier(.6,.04,.98,.34),opacity .6s ease-in;
  transform:scale(0)!important;
  opacity:0!important;
}

/* sentence popup */
#sentence{
  position:fixed;top:50%;left:50%;z-index:200;
  transform:translate(-50%,-50%) scale(0.8);
  opacity:0;
  background:rgba(26,26,20,.88);
  color:#F0E4C4;
  padding:28px 36px;
  border-radius:12px;
  font-family:'Zen Antique Soft',serif;
  font-size:20px;
  letter-spacing:2px;
  line-height:1.8;
  text-align:center;
  max-width:85vw;
  pointer-events:none;
  transition:transform .5s cubic-bezier(.2,.8,.3,1),opacity .5s;
}
#sentence.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}
#sentence .sword{
  color:#e8c87a;
  font-size:1.15em;
}

@media(max-width:600px){
  .w{letter-spacing:2px}
  #bar{padding:16px 20px 22px;flex-direction:column;gap:8px}
  #bar .bw{font-size:22px;letter-spacing:5px}
  #bar .bd{font-size:12px;line-height:1.7}
  #wm{top:12px;left:14px}
  #wm .t1{font-size:14px;letter-spacing:6px}
  #wm .t2{font-size:8px}
  #shuffle{width:36px;height:36px;bottom:14px;right:14px;font-size:16px}
  #sentence{font-size:16px;padding:20px 24px;max-width:92vw}
}
</style>
</head>
<body>

<div id="map"></div>
<div id="tint"></div>

<div id="wm">
  <div class="t1"><ruby>一乗寺<rp>(</rp><rt>いちじょうじ</rt><rp>)</rp></ruby></div>
  <div class="t2">京都 — 文化と味が交差する街</div>
</div>

<div id="bar">
  <div class="bw" id="bw"></div>
  <div class="bd" id="bd"></div>
</div>

<button id="shuffle" title="ことばを入れ替える">&#x21bb;</button>
<div id="sentence"></div>

<script>
var LOCAL=[{"t":"ラーメン","r":"らーめん","d":"小麦粉の麺をスープで食べる料理で、一乗寺はラーメンの街として有名だよ。","s":"一乗寺で熱々のラーメンを食べた。"},{"t":"麺","r":"めん","d":"小麦粉をこねてのばして作る細長い食べもののことだよ。","s":"麺がもちもちしていておいしかった。"},{"t":"スープ","r":"すーぷ","d":"ラーメンの味を決める大事な汁のことだよ。","s":"最後の一滴までスープを飲みほした。"},{"t":"チャーシュー","r":"ちゃーしゅー","d":"豚肉をたれにつけてじっくり焼いたり煮たりしたお肉のことだよ。","s":"とろとろのチャーシューがのっていた。"},{"t":"煮卵","r":"にたまご","d":"たまごをゆでてからたれにつけて味をしみこませたものだよ。","s":"煮卵を半分に割ったら黄身がとろっとした。"},{"t":"背脂","r":"せあぶら","d":"豚の背中の脂のことで、ラーメンに浮かべるとこってりするよ。","s":"背脂がたっぷり浮いたラーメンだった。"},{"t":"醤油","r":"しょうゆ","d":"大豆から作られる茶色い調味料で、ラーメンのスープにも使われるよ。","s":"京都の醤油ラーメンが一番好きだ。"},{"t":"味噌","r":"みそ","d":"大豆を発酵させて作る調味料で、味噌ラーメンの味のもとだよ。","s":"おばあちゃんが毎朝味噌汁を作ってくれる。"},{"t":"塩","r":"しお","d":"海水から作られる白い調味料で、塩ラーメンはあっさりした味だよ。","s":"おにぎりに塩をぱらぱらとまぶした。"},{"t":"太麺","r":"ふとめん","d":"ふつうより太い麺のことで、もちもちした食感が楽しめるよ。","s":"太麺がスープによくからんでおいしい。"},{"t":"細麺","r":"ほそめん","d":"ふつうより細い麺のことで、スープがよくからむよ。","s":"つるつるの細麺をあっという間に食べた。"},{"t":"こってり","r":"こってり","d":"脂が多くて濃い味のことで、一乗寺のラーメンに多いよ。","s":"こってりしたスープが体を温めてくれた。"},{"t":"あっさり","r":"あっさり","d":"脂が少なくてさっぱりした味のことだよ。","s":"暑い日はあっさりした塩ラーメンがいい。"},{"t":"替え玉","r":"かえだま","d":"ラーメンの麺だけをおかわりすることだよ。","s":"お父さんが替え玉をもう一つ頼んだ。"},{"t":"丼","r":"どんぶり","d":"ラーメンや親子丼を入れる大きくて深いお茶碗のことだよ。","s":"大きな丼を両手でかかえて持った。"},{"t":"箸","r":"はし","d":"ごはんや麺を食べるときに使う二本の棒のことだよ。","s":"新しい箸がつるつるしてつかみにくい。"},{"t":"れんげ","r":"れんげ","d":"ラーメンのスープをすくうときに使う小さなスプーンだよ。","s":"れんげでスープをすくって飲んだ。"},{"t":"のり","r":"のり","d":"海藻を薄くして乾かしたもので、ラーメンにのせることもあるよ。","s":"ラーメンの上にのりが二枚のっていた。"},{"t":"ねぎ","r":"ねぎ","d":"細く切ってラーメンの上にのせる緑色の野菜だよ。","s":"ラーメンにねぎをたくさんのせてもらった。"},{"t":"にんにく","r":"にんにく","d":"香りが強い野菜で、ラーメンに入れるとパンチが出るよ。","s":"にんにくを入れたらもっとおいしくなった。"},{"t":"もやし","r":"もやし","d":"豆から出た白い芽で、ラーメンの具としてよく使われるよ。","s":"もやしがシャキシャキしておいしかった。"},{"t":"メンマ","r":"めんま","d":"たけのこを発酵させて作ったラーメンの具だよ。","s":"メンマのコリコリした食感が好きだ。"},{"t":"餃子","r":"ぎょうざ","d":"肉と野菜をうすい皮で包んで焼いた料理で、ラーメンと一緒に食べることが多いよ。","s":"ラーメンと一緒に焼き餃子も注文した。"},{"t":"唐揚げ","r":"からあげ","d":"鶏肉に味をつけて油で揚げたおかずのことだよ。","s":"お母さんの唐揚げは世界一おいしい。"},{"t":"炒飯","r":"ちゃーはん","d":"ごはんを卵や具と一緒に炒めた料理だよ。","s":"パラパラの炒飯がお皿に出てきた。"},{"t":"ラーメン屋","r":"らーめんや","d":"ラーメンを出すお店のことで、一乗寺にはたくさんあるよ。","s":"一乗寺のラーメン屋はいつも人がいっぱいだ。"},{"t":"行列","r":"ぎょうれつ","d":"人が順番にならんで待つことで、人気のラーメン屋にはよくできるよ。","s":"人気のお店の前に長い行列ができていた。"},{"t":"食べ歩き","r":"たべあるき","d":"いろいろなお店をまわりながら食べることだよ。","s":"一乗寺でラーメンの食べ歩きをした。"},{"t":"暖簾","r":"のれん","d":"お店の入り口にかかっている布のことで、お店の目印になるよ。","s":"お店の暖簾をくぐって中に入った。"},{"t":"湯気","r":"ゆげ","d":"熱いラーメンから立ちのぼる白いけむりのようなものだよ。","s":"ラーメンから湯気がもくもく出ていた。"},{"t":"出汁","r":"だし","d":"昆布やかつお節からとったうまみたっぷりの汁のことだよ。","s":"お母さんが朝から出汁をとっている。"},{"t":"豚骨","r":"とんこつ","d":"豚の骨をじっくり煮込んで作る白くて濃いスープのことだよ。","s":"豚骨スープのにおいが風に乗ってきた。"},{"t":"鶏ガラ","r":"とりがら","d":"鶏の骨を煮込んで作るスープのもとのことだよ。","s":"鶏ガラでとったスープは透き通っている。"},{"t":"味玉","r":"あじたま","d":"味がしっかりしみた半熟のゆでたまごのことだよ。","s":"ラーメンに味玉をトッピングした。"},{"t":"食券","r":"しょっけん","d":"ラーメン屋で先にきっぷを買って注文する仕組みのことだよ。","s":"入口で食券を買ってカウンターに出した。"},{"t":"大盛り","r":"おおもり","d":"ふつうよりたくさん麺やごはんが入っていることだよ。","s":"お兄ちゃんはいつも大盛りを頼む。"},{"t":"カウンター","r":"かうんたー","d":"お店の人のすぐ前にある細長い席のことだよ。","s":"カウンターに座ってラーメンを待った。"},{"t":"すする","r":"すする","d":"麺やスープを音をたてて口に吸い込むことだよ。","s":"熱い麺をふうふうしてからすする。"},{"t":"完食","r":"かんしょく","d":"出された料理を残さず全部食べきることだよ。","s":"がんばって完食したらうれしかった。"},{"t":"一杯","r":"いっぱい","d":"ラーメンやうどんを数えるときの言い方だよ。","s":"寒い日の一杯のラーメンは最高だ。"},{"t":"お寺","r":"おてら","d":"お坊さんがいて仏さまをまつっている建物のことだよ。","s":"一乗寺にはお寺がたくさん並んでいる。"},{"t":"本堂","r":"ほんどう","d":"お寺の中で一番大切な建物のことだよ。","s":"本堂の前で手を合わせておじぎした。"},{"t":"仏像","r":"ぶつぞう","d":"仏さまの姿を木や石で作ったもののことだよ。","s":"大きな仏像を見上げてびっくりした。"},{"t":"お坊さん","r":"おぼうさん","d":"お寺で修行をしてお経を読む人のことだよ。","s":"お坊さんが静かにお経を読んでいた。"},{"t":"鐘","r":"かね","d":"お寺にある大きな金属の鐘で、つくとゴーンと鳴るよ。","s":"お寺の鐘がゴーンと大きく鳴りひびいた。"},{"t":"お線香","r":"おせんこう","d":"火をつけるとよい香りのけむりが出る細い棒のことだよ。","s":"お線香のけむりがゆっくり立ちのぼった。"},{"t":"お参り","r":"おまいり","d":"神社やお寺に行って手を合わせておいのりすることだよ。","s":"お正月に家族みんなでお参りに行った。"},{"t":"石段","r":"いしだん","d":"石で作られた階段のことで、お寺によくあるよ。","s":"長い石段をのぼってやっとお寺に着いた。"},{"t":"山門","r":"さんもん","d":"お寺の入り口にある大きな門のことだよ。","s":"立派な山門をくぐってお寺に入った。"},{"t":"灯籠","r":"とうろう","d":"石や金属で作られた明かりを入れるための台のことだよ。","s":"参道に並んだ灯籠に明かりが灯っていた。"},{"t":"苔","r":"こけ","d":"石や地面に生える緑色の小さな植物で、京都のお寺によく見られるよ。","s":"庭の石の上に苔がびっしり生えていた。"},{"t":"静寂","r":"せいじゃく","d":"音がまったくしない静かな状態のことだよ。","s":"本堂の中は静寂につつまれていた。"},{"t":"お地蔵さん","r":"おじぞうさん","d":"道ばたやお寺にいる子どもを守ってくれるやさしい仏さまだよ。","s":"道ばたのお地蔵さんに手を合わせた。"},{"t":"手水","r":"ちょうず","d":"神社やお寺で手と口を水できれいにすることだよ。","s":"手水で手を清めてからお参りした。"},{"t":"おみくじ","r":"おみくじ","d":"神社やお寺で引く占いの紙のことで、大吉が一番いいよ。","s":"おみくじを引いたら大吉が出てうれしかった。"},{"t":"絵馬","r":"えま","d":"願いごとを書いて神社やお寺にかける木の板のことだよ。","s":"絵馬に「テストがんばる」と書いた。"},{"t":"お守り","r":"おまもり","d":"持っていると守ってもらえるという小さなふくろのことだよ。","s":"合格祈願のお守りを買ってもらった。"},{"t":"境内","r":"けいだい","d":"お寺や神社のしきちの中のことだよ。","s":"境内を歩くと秋の風が気持ちよかった。"},{"t":"紅葉","r":"こうよう","d":"秋に葉っぱが赤や黄色に色づくことで、京都の秋はとてもきれいだよ。","s":"秋の一乗寺は紅葉がとてもきれいだ。"},{"t":"枯山水","r":"かれさんすい","d":"水を使わずに石や砂で山や川を表した庭のことだよ。","s":"枯山水の庭をしばらくじっと見つめた。"},{"t":"写経","r":"しゃきょう","d":"お経の文字を一つずつていねいに書き写す修行のことだよ。","s":"お寺で初めての写経に挑戦してみた。"},{"t":"御朱印","r":"ごしゅいん","d":"お寺や神社でもらえる特別なはんこと手書きの記念だよ。","s":"御朱印帳に新しい御朱印をもらった。"},{"t":"参道","r":"さんどう","d":"神社やお寺の入り口まで続く道のことだよ。","s":"参道の両側に大きな木が並んでいた。"},{"t":"仁王","r":"におう","d":"お寺の門で怖い顔をして守っている大きな像のことだよ。","s":"仁王の怖い顔に思わず足が止まった。"},{"t":"精進料理","r":"しょうじんりょうり","d":"お肉や魚を使わずに野菜だけで作るお寺の料理のことだよ。","s":"京都のお寺で精進料理をいただいた。"},{"t":"梵鐘","r":"ぼんしょう","d":"お寺にある大きな鐘のことで、大みそかにつくことで有名だよ。","s":"大晦日に梵鐘をつかせてもらった。"},{"t":"瓦","r":"かわら","d":"屋根にならべる焼き物のことで、お寺の屋根によく使われるよ。","s":"お寺の屋根の瓦が日に照らされていた。"},{"t":"庫裏","r":"くり","d":"お寺の中でお坊さんたちがごはんを作ったり暮らしたりする建物だよ。","s":"庫裏の方からおいしそうなにおいがした。"},{"t":"座禅","r":"ざぜん","d":"足を組んで静かに座り心をしずめる修行のことだよ。","s":"お寺で座禅を組んだら足がしびれた。"},{"t":"蓮","r":"はす","d":"泥の中から美しい花を咲かせる植物で、仏さまと関係が深いよ。","s":"お寺の池に蓮の花がきれいに咲いていた。"},{"t":"比叡山","r":"ひえいざん","d":"京都の北東にそびえる大きな山で、一乗寺からもよく見えるよ。","s":"一乗寺の高台から比叡山がよく見えた。"},{"t":"東山","r":"ひがしやま","d":"京都の東がわにある山なみのことだよ。","s":"東山の向こうに夕日がゆっくり沈んだ。"},{"t":"疏水","r":"そすい","d":"琵琶湖から京都に水を引くために作られた水路のことだよ。","s":"疏水沿いの道を友だちと自転車で走った。"},{"t":"小川","r":"おがわ","d":"小さな川のことで、一乗寺のまわりにも流れているよ。","s":"小川でザリガニを見つけてつかまえた。"},{"t":"石畳","r":"いしだたみ","d":"平たい石をしきつめた道のことで、京都の古い道によくあるよ。","s":"雨に濡れた石畳がきらきら光っていた。"},{"t":"竹林","r":"ちくりん","d":"竹がたくさん生えている林のことだよ。","s":"竹林を風がさわさわと吹き抜けた。"},{"t":"朝霧","r":"あさぎり","d":"朝に出る白いもやのことで、山のそばでよく見られるよ。","s":"朝霧の中に比叡山がぼんやり見えた。"},{"t":"夕暮れ","r":"ゆうぐれ","d":"夕方に空がオレンジ色に染まる時間のことだよ。","s":"夕暮れの空がオレンジ色に染まった。"},{"t":"路地","r":"ろじ","d":"家と家の間にある細い道のことだよ。","s":"細い路地を抜けるとお寺が見えた。"},{"t":"坂道","r":"さかみち","d":"ななめに上がっている道のことで、山のそばにはたくさんあるよ。","s":"坂道を自転車で一気にかけ下りた。"},{"t":"用水路","r":"ようすいろ","d":"田んぼや畑に水を送るために作られた小さな水路のことだよ。","s":"用水路にメダカの群れが泳いでいた。"},{"t":"田んぼ","r":"たんぼ","d":"お米を育てるための水をはった畑のことだよ。","s":"田んぼからカエルの声がひびいてきた。"},{"t":"畑","r":"はたけ","d":"野菜や花を育てる土地のことだよ。","s":"おじいちゃんの畑でトマトをもいだ。"},{"t":"桜","r":"さくら","d":"春にピンクや白の花を咲かせる木で、京都のお花見は有名だよ。","s":"春になると桜が一斉に咲きはじめる。"},{"t":"松","r":"まつ","d":"一年中緑の葉をつけている木で、一乗寺下り松が有名だよ。","s":"松の枝に雪がこんもり積もっていた。"},{"t":"椿","r":"つばき","d":"冬から春にかけて赤い花を咲かせる木だよ。","s":"赤い椿の花がぽとりと地面に落ちた。"},{"t":"青空","r":"あおぞら","d":"雲のない青い空のことだよ。","s":"青空の下でみんなとお弁当を広げた。"},{"t":"清流","r":"せいりゅう","d":"水がとても澄んでいてきれいな川のことだよ。","s":"清流に足をつけたらひんやり冷たかった。"},{"t":"野鳥","r":"やちょう","d":"山や川のそばにいる自然の中で暮らす鳥のことだよ。","s":"朝早く起きたら野鳥のさえずりが聞こえた。"},{"t":"四季","r":"しき","d":"春と夏と秋と冬の四つの季節のことで、京都は四季がとてもきれいだよ。","s":"京都の四季を絵日記に描いてみたい。"},{"t":"新緑","r":"しんりょく","d":"春に木々から出てくるみずみずしい緑色の若い葉っぱのことだよ。","s":"山の新緑がまぶしくてまぶたを細めた。"},{"t":"落ち葉","r":"おちば","d":"秋に木から落ちた葉っぱのことだよ。","s":"たくさんの落ち葉を集めて焼きいもをした。"},{"t":"木漏れ日","r":"こもれび","d":"木の葉っぱのすきまから差し込む太陽の光のことだよ。","s":"木漏れ日がきらきらと地面をてらした。"},{"t":"夕焼け","r":"ゆうやけ","d":"日が沈むときに空が赤く染まることだよ。","s":"夕焼けがきれいで思わず立ち止まった。"},{"t":"霜","r":"しも","d":"冬の朝に地面や草に白くつく氷のつぶのことだよ。","s":"朝起きたら畑一面に霜がおりていた。"},{"t":"宮本武蔵","r":"みやもとむさし","d":"日本一強いと言われた剣の達人で、一乗寺で決闘をしたことで有名だよ。","s":"宮本武蔵が一乗寺で戦った話を聞いた。"},{"t":"決闘","r":"けっとう","d":"一対一で勝負を決める真剣な戦いのことだよ。","s":"宮本武蔵の決闘の話にわくわくした。"},{"t":"剣","r":"けん","d":"両がわに刃がある長い武器のことだよ。","s":"木の枝を拾って剣のまねをして遊んだ。"},{"t":"武士","r":"ぶし","d":"昔の日本で刀を持って戦った人たちのことだよ。","s":"昔の武士みたいに強くなりたいと思った。"},{"t":"侍","r":"さむらい","d":"武士のことを別の言い方で呼んだものだよ。","s":"侍のかっこうをして写真を撮った。"},{"t":"刀","r":"かたな","d":"武士が腰にさしていた日本の伝統的な武器のことだよ。","s":"博物館でほんものの刀を見て感動した。"},{"t":"弓","r":"ゆみ","d":"矢をつがえて飛ばすための武器で ンチリンと鳴っていた。"},{"t":"提灯","r":"ちょうちん","d":"紙や布で作った明かりで、お祭りやお店の前でよく見るよ。","s":"提灯の明かりが夜道をやさしくてらした。"},{"t":"抹茶","r":"まっちゃ","d":"緑色のお茶の粉で、お茶をたてるときに使うよ。","s":"一乗寺のお茶屋さんで抹茶を飲んだ。"},{"t":"和菓子","r":"わがし","d":"日本の伝統的なお菓子で、きれいな形のものがたくさんあるよ。","s":"和菓子屋さんで季節のお菓子を選んだ。"},{"t":"団子","r":"だんご","d":"お米の粉をこねて丸めた和菓子で、串にさして食べるよ。","s":"お花見をしながら団子をほおばった。"},{"t":"豆腐","r":"とうふ","d":"大豆から作る白くてやわらかい食べもので、京都の豆腐は有名だよ。","s":"冷やっこの豆腐にかつお節をかけて食べた。"},{"t":"漬物","r":"つけもの","d":"野菜を塩やぬかにつけて作る保存食で、京都は漬物の種類が多いよ。","s":"ごはんと漬物だけでもとてもおいしい。"},{"t":"おばんざい","r":"おばんざい","d":"京都のおうちで昔から作られてきたおかずのことだよ。","s":"京都のおばんざいを並べて晩ごはんにした。"},{"t":"番茶","r":"ばんちゃ","d":"京都の人がふだん飲んでいるあっさりしたお茶のことだよ。","s":"ごはんの後にあたたかい番茶を飲んだ。"},{"t":"銭湯","r":"せんとう","d":"みんなが入れる大きなおふろ屋さんのことだよ。","s":"近所の銭湯に行ってゆっくりあたたまった。"},{"t":"自転車","r":"じてんしゃ","d":"京都の人がよく使うのりもので、一乗寺を走るのも気持ちいいよ。","s":"自転車で一乗寺の坂道を走り抜けた。"},{"t":"商店街","r":"しょうてんがい","d":"いろいろなお店がならんでいる通りのことだよ。","s":"商店街でお母さんのおつかいを頼まれた。"},{"t":"古本屋","r":"ふるほんや","d":"読み終わった本を売ったり買ったりするお店のことだよ。","s":"一乗寺の古本屋でおもしろい絵本を見つけた。"},{"t":"銘菓","r":"めいか","d":"その土地で有名なおいしいお菓子のことだよ。","s":"京都の銘菓をお土産に買って帰った。"},{"t":"八つ橋","r":"やつはし","d":"ニッキの香りがする京都のおみやげの定番のお菓子だよ。","s":"修学旅行のお土産に八つ橋を選んだ。"},{"t":"京野菜","r":"きょうやさい","d":"京都で昔から育てられてきた特別な野菜のことだよ。","s":"お母さんが京野菜で煮物を作ってくれた。"},{"t":"湯豆腐","r":"ゆどうふ","d":"豆腐をお鍋であたためて食べるシンプルな京都の料理だよ。","s":"寒い日に家族みんなで湯豆腐を食べた。"},{"t":"床几","r":"しょうぎ","d":"お店の前に置いてある木の長いすのことで、京都のお茶屋さんで見かけるよ。","s":"お店の前の床几に腰かけてかき氷を食べた。"},{"t":"打ち水","r":"うちみず","d":"暑い日に道に水をまいて涼しくすることだよ。","s":"夏の朝におばあちゃんが玄関に打ち水をした。"},{"t":"五山送り火","r":"ございおくりび","d":"お盆に京都の山で大きな火を燃やす伝統行事で、一乗寺からもよく見えるよ。","s":"屋上から五山送り火を家族で見上げた。"},{"t":"祇園祭","r":"ぎおんまつり","d":"毎年七月に京都で行われる日本で一番有名なお祭りの一つだよ。","s":"七月になると祇園祭のおはやしが聞こえてくる。"},{"t":"お茶会","r":"おちゃかい","d":"抹茶をたてておもてなしをする集まりのことだよ。","s":"お寺のお茶会でお抹茶をいただいた。"},{"t":"地蔵盆","r":"じぞうぼん","d":"夏に子どもたちがお地蔵さんのまわりに集まってお祝いする行事だよ。","s":"地蔵盆で近所の友達とお菓子をもらった。"},{"t":"暮らし","r":"くらし","d":"毎日の生活のことで、一乗寺はのんびりした暮らしが楽しめる町だよ。","s":"一乗寺での暮らしがとても気に入っている。"},{"t":"金閣寺","r":"きんかくじ","d":"金色にかがやくお寺で、京都でいちばん有名な建物のひとつだよ。","s":"金閣寺が池に映ってきらきら光っていた。"},{"t":"銀閣寺","r":"ぎんかくじ","d":"一乗寺のちかくにある落ちついたお寺で、わびさびの美しさを感じられるよ。","s":"一乗寺から歩いて銀閣寺まで行った。"},{"t":"清水寺","r":"きよみずでら","d":"大きな舞台があるお寺で、「清水の舞台から飛びおりる」ということわざでも有名だよ。","s":"清水寺の舞台から京都の町を見下ろした。"},{"t":"嵐山","r":"あらしやま","d":"京都の西にある自然がいっぱいの場所で、春は桜、秋は色づく木々がきれいだよ。","s":"秋の嵐山は紅葉がとてもきれいだった。"},{"t":"鴨川","r":"かもがわ","d":"京都の街なかを流れる川で、川べりをさんぽするのがとっても気持ちいいよ。","s":"鴨川の河原に降りて水遊びをした。"},{"t":"祇園","r":"ぎおん","d":"舞妓さんに会えるかもしれない、昔ながらの美しい街なみが残るところだよ。","s":"祇園の通りで舞妓さんとすれちがった。"},{"t":"伏見稲荷","r":"ふしみいなり","d":"赤い鳥居がずらっとならんでいる神社で、まるでトンネルみたいだよ。","s":"伏見稲荷の赤い鳥居をくぐって歩いた。"},{"t":"二条城","r":"にじょうじょう","d":"徳川家康がつくったお城で、歩くとキュッと鳴る「うぐいす張り」の廊下があるよ。","s":"二条城の廊下を歩くとキュッキュッと鳴った。"},{"t":"平安神宮","r":"へいあんじんぐう","d":"大きくて赤い鳥居がめじるしの神社で、広いお庭もすてきだよ。","s":"平安神宮の大きな鳥居にびっくりした。"},{"t":"哲学の道","r":"てつがくのみち","d":"銀閣寺のちかくにある小道で、春は桜のトンネルになってとてもきれいだよ。","s":"春の哲学の道を桜を見ながらのんびり歩いた。"},{"t":"南禅寺","r":"なんぜんじ","d":"大きな山門とレンガの水路閣がある、とても立派なお寺だよ。","s":"南禅寺の水路閣の前で写真を撮った。"},{"t":"大文字山","r":"だいもんじやま","d":"一乗寺からも見える山で、夏には「大」の字の火がともされるんだよ。","s":"大文字山の頂上から京都の町が一望できた。"},{"t":"五条大橋","r":"ごじょうおおはし","d":"牛若丸と弁慶が出会ったと言われる有名な橋だよ。","s":"五条大橋を渡って向こう岸まで歩いた。"},{"t":"北野天満宮","r":"きたのてんまんぐう","d":"学問の神さま菅原道真をまつっていて、受験生がたくさんお参りにくるよ。","s":"北野天満宮の梅の花がきれいに咲いていた。"},{"t":"下鴨神社","r":"しもがもじんじゃ","d":"糺の森という静かな森にかこまれた、とても古い神社だよ。","s":"下鴨神社の森の中はとても涼しかった。"},{"t":"上賀茂神社","r":"かみがもじんじゃ","d":"京都でもっとも古い神社のひとつで、白い砂で作った円すいの山が有名だよ。","s":"上賀茂神社の小川で水遊びをした。"},{"t":"三十三間堂","r":"さんじゅうさんげんどう","d":"千体もの仏さまがずらっとならんでいて、そのすがたに圧倒されるよ。","s":"三十三間堂にずらりと並ぶ仏像に驚いた。"},{"t":"龍安寺","r":"りょうあんじ","d":"白い砂と石だけで作られた石庭がある、世界的に有名なお寺だよ。","s":"龍安寺の石庭を縁側に座ってじっと眺めた。"},{"t":"西陣","r":"にしじん","d":"美しい生地「西陣織」で有名な、京都の職人さんの街だよ。","s":"西陣の路地裏から機織りの音が聞こえた。"},{"t":"先斗町","r":"ぽんとちょう","d":"鴨川ぞいにある細い路地で、夜になると灯りがともってとても風情があるよ。","s":"夕方の先斗町の細い路地をそぞろ歩いた。"},{"t":"八坂神社","r":"やさかじんじゃ","d":"祇園祭のときに中心になる神社で、朱色の門がとても美しいよ。","s":"八坂神社の石段を友達と駆け上がった。"},{"t":"貴船","r":"きぶね","d":"夏でもすずしい山あいの場所で、川の上で食べる「川床」が楽しいよ。","s":"夏休みに貴船の川床に連れていってもらった。"},{"t":"大原","r":"おおはら","d":"京都の北にある静かな里で、三千院というお寺がとても有名だよ。","s":"大原の山里はとても静かで気持ちよかった。"},{"t":"修学院離宮","r":"しゅがくいんりきゅう","d":"一乗寺のちかくにある皇室のお庭で、山の上から見る景色がすばらしいよ。","s":"修学院離宮の広い庭園をゆっくり歩いた。"},{"t":"陶芸","r":"とうげい","d":"土をこねてお皿やお茶碗をつくる芸術で、手で形をつくるのが楽しいよ。","s":"陶芸教室で自分だけのお皿を作った。"},{"t":"染物","r":"そめもの","d":"布にきれいな色や模様をつける仕事で、京都ではとくに有名だよ。","s":"京都の染物工房でハンカチを染めた。"},{"t":"友禅","r":"ゆうぜん","d":"布にうつくしい絵を描いて染める京都の伝統的な技法だよ。","s":"友禅染めの体験で手ぬぐいに模様をつけた。"},{"t":"扇","r":"おうぎ","d":"パタパタとあおいで風をおくる道具で、きれいな絵がかいてあるよ。","s":"おばあちゃんが扇であおいで風を送ってくれた。"},{"t":"筆","r":"ふで","d":"墨をつけて字や絵をかく道具で、やわらかい毛でできているよ。","s":"書道の時間に新しい筆をおろした。"},{"t":"墨","r":"すみ","d":"すずりで水と一緒にすると黒い液になる、書道に使う道具だよ。","s":"硯の上でゆっくり墨をすると良い香りがした。"},{"t":"和紙","r":"わし","d":"日本の伝統的な紙で、ふつうの紙よりもじょうぶで長もちするよ。","s":"きれいな模様の和紙を使って折り紙をした。"},{"t":"漆","r":"うるし","d":"木に塗るとピカピカに光る天然のぬり材で、お椀やお箸に使われるよ。","s":"お椀に塗られた漆がつやつや光っている。"},{"t":"金箔","r":"きんぱく","d":"金をうすーくのばしたもので、工芸品やお菓子のかざりに使われるよ。","s":"金箔がのったソフトクリームを食べてみた。"},{"t":"織物","r":"おりもの","d":"糸を組み合わせて布をつくることで、京都には美しい織物がたくさんあるよ。","s":"工房で織物を作る音がトントン響いていた。"},{"t":"刺繍","r":"ししゅう","d":"針と糸で布に絵や模様をぬうことで、とても細かくてきれいだよ。","s":"お母さんがハンカチに花の刺繍を入れてくれた。"},{"t":"焼き物","r":"やきもの","d":"土や石をこねて形をつくり、かまで焼いてつくるお皿やつぼのことだよ。","s":"窯元に並んだ色とりどりの焼き物を見て回った。"},{"t":"茶碗","r":"ちゃわん","d":"お茶をのむための器で、ひとつひとつ手づくりで形がちがうのが楽しいよ。","s":"おじいちゃんお気に入りの茶碗でお茶を飲んだ。"},{"t":"花瓶","r":"かびん","d":"お花をいけるための器で、京都にはうつくしい焼き物の花瓶がたくさんあるよ。","s":"花瓶に庭で摘んだコスモスを飾った。"},{"t":"蒔絵","r":"まきえ","d":"漆の上に金や銀の粉で絵をえがく技法で、キラキラしてとても美しいよ。","s":"蒔絵の小箱がきらきら光ってきれいだった。"},{"t":"屏風","r":"びょうぶ","d":"折りたたみ式の大きなついたてで、きれいな絵がかかれていることが多いよ。","s":"博物館の屏風に金色の虎が描かれていた。"},{"t":"掛け軸","r":"かけじく","d":"絵や書を巻き物にして壁にかける日本の伝統的な飾りだよ。","s":"床の間の掛け軸が季節ごとに変わるのが楽しい。"},{"t":"七宝焼き","r":"しっぽうやき","d":"金属にガラスの粉をのせて焼くと、宝石みたいにきれいな模様ができるよ。","s":"七宝焼きのブローチを自分で手作りした。"},{"t":"竹細工","r":"たけざいく","d":"竹をうすく割って編んだり曲げたりして、かごや花入れをつくる仕事だよ。","s":"おじいちゃんが竹細工でかごを編んでくれた。"},{"t":"西陣織","r":"にしじんおり","d":"京都の西陣で織られる高級な布で、金糸や銀糸をつかった美しい模様が特徴だよ。","s":"お母さんの西陣織の帯がとても華やかだった。"},{"t":"清水焼","r":"きよみずやき","d":"京都で作られる焼き物のことで、うつくしい色あいが人気だよ。","s":"清水焼の湯呑みをお土産にもらった。"},{"t":"能面","r":"のうめん","d":"能というげきで使うお面で、角度によって表情がかわって見えるんだよ。","s":"能面をつけてみたら別人になった気がした。"},{"t":"千代紙","r":"ちよがみ","d":"きれいな模様がプリントされた日本の紙で、折り紙にもつかうよ。","s":"千代紙を使ってきれいな鶴を折った。"},{"t":"組紐","r":"くみひも","d":"何本もの糸をあんで作るひもで、帯じめなどに使われるきれいな工芸品だよ。","s":"京都で組紐のストラップを作る体験をした。"},{"t":"箔押し","r":"はくおし","d":"金箔や銀箔をおして模様をつける技法で、本の表紙やお菓子の箱にも使われるよ。","s":"箔押しの模様が入ったノートを買った。"},{"t":"大文字焼き","r":"だいもんじやき","d":"8月16日に山に「大」の字の火をともす京都の夏の風物詩だよ。","s":"夏の夜に大文字焼きの火が山に灯った。"},{"t":"時代祭","r":"じだいまつり","d":"昔の衣装を着た人たちが行列する、京都三大祭りのひとつだよ。","s":"時代祭の行列を道ばたでわくわく見物した。"},{"t":"節分","r":"せつぶん","d":"2月はじめに「鬼は外、福は内」と言いながら豆をまく行事だよ。","s":"節分の日にお寺で福豆をもらった。"},{"t":"豆まき","r":"まめまき","d":"節分のときに豆を投げて悪い鬼を追いはらう、楽しい行事だよ。","s":"「鬼は外」とさけびながら豆まきをした。"},{"t":"七夕","r":"たなばた","d":"7月7日に願いごとを短冊に書いて笹にかざる、星のお祭りだよ。","s":"七夕の夜に願いごとを短冊に書いた。"},{"t":"お盆","r":"おぼん","d":"ご先祖さまが帰ってくるとされる夏の行事で、家族みんなでお迎えするよ。","s":"お盆に田舎のおじいちゃんの家へ帰った。"},{"t":"盆踊り","r":"ぼんおどり","d":"お盆のときにみんなで輪になっておどる、夏の楽しいイベントだよ。","s":"盆踊りの輪に飛び入りで加わって踊った。"},{"t":"初詣","r":"はつもうで","d":"お正月に神社やお寺にお参りして、新しい年のお願いごとをすることだよ。","s":"お正月に家族そろって初詣に出かけた。"},{"t":"除夜の鐘","r":"じょやのかね","d":"大みそかの夜に108回つく鐘の音で、新しい年を気持ちよくむかえるんだよ。","s":"大みそかの夜にお寺で除夜の鐘を聞いた。"},{"t":"雛祭り","r":"ひなまつり","d":"3月3日に雛人形をかざって女の子のしあわせを願うお祭りだよ。","s":"雛祭りにお母さんとちらし寿司を作った。"},{"t":"端午の節句","r":"たんごのせっく","d":"5月5日にこいのぼりをあげて、男の子の元気な成長を願う日だよ。","s":"端午の節句にこいのぼりが空を泳いでいた。"},{"t":"十五夜","r":"じゅうごや","d":"秋の満月を見ながらお月見だんごをたべる、風流な行事だよ。","s":"十五夜の晩にまんまるのお月さまが出た。"},{"t":"お花見","r":"おはなみ","d":"桜の木の下でみんなでお弁当を食べたりして楽しむ、春のすてきな行事だよ。","s":"桜の下にシートを敷いてお花見をした。"},{"t":"葵祭","r":"あおいまつり","d":"京都三大祭りのひとつで、葵の葉をかざった行列が街を歩くよ。","s":"葵祭の行列がゆっくり通りを進んでいった。"},{"t":"鞍馬の火祭","r":"くらまのひまつり","d":"10月に鞍馬で行われる迫力まんてんの火のお祭りだよ。","s":"鞍馬の火祭の大きな松明に圧倒された。"},{"t":"正月","r":"しょうがつ","d":"新しい年のはじまりをお祝いする日本でいちばん大きな行事だよ。","s":"正月に従兄弟たちとこま回しをして遊んだ。"},{"t":"年越し","r":"としこし","d":"12月31日の夜に古い年をおくり新しい年をむかえることだよ。","s":"家族みんなで年越しそばをすすった。"},{"t":"お月見","r":"おつきみ","d":"きれいな月を見ながらすすきをかざって秋の夜をたのしむ行事だよ。","s":"縁側でお月見をしながらお団子を食べた。"},{"t":"彼岸","r":"ひがん","d":"春と秋にご先祖さまのお墓まいりをする期間で、おはぎを食べたりするよ。","s":"お彼岸にお墓参りに行っておはぎを供えた。"},{"t":"夏祭り","r":"なつまつり","d":"夏に行われるお祭りで、屋台がならんで花火があがってとてもにぎやかだよ。","s":"夏祭りでかき氷と焼きそばを買った。"},{"t":"秋祭り","r":"あきまつり","d":"実りの秋に感謝するお祭りで、おみこしが出たりしてにぎわうよ。","s":"秋祭りでお神輿をみんなでかついだ。"},{"t":"餅つき","r":"もちつき","d":"臼と杵をつかってぺったんぺったんとおもちをつく、年末の楽しい行事だよ。","s":"年末に近所の人たちと餅つきをした。"},{"t":"書き初め","r":"かきぞめ","d":"お正月に新年のめあてや好きな言葉を筆で書く伝統行事だよ。","s":"お正月に書き初めで「希望」と大きく書いた。"},{"t":"成人式","r":"せいじんしき","d":"20歳になったことをお祝いする式で、はれ着を着ておとなの仲間入りをするんだよ。","s":"お姉ちゃんが成人式で振袖を着ていた。"},{"t":"おでん","r":"おでん","d":"大根やたまごをあったかいだし汁でにこんだ、冬にぴったりの料理だよ。","s":"寒い日にあつあつのおでんで体が温まった。"},{"t":"焼き芋","r":"やきいも","d":"さつまいもを焼いたもので、ほくほく甘くて冬のおやつにさいこうだよ。","s":"落ち葉を集めてみんなで焼き芋を作った。"},{"t":"たこ焼き","r":"たこやき","d":"まるい生地の中にたこが入った関西の名物で、外はカリカリ中はトロトロだよ。","s":"友達の家でたこ焼きパーティーをした。"},{"t":"お好み焼き","r":"おこのみやき","d":"キャベツやお肉を生地にまぜて焼く関西のソウルフードだよ。","s":"お好み焼きをひっくり返すのが楽しかった。"},{"t":"うどん","r":"うどん","d":"太くてもちもちした食べもので、あたたかいおだしで食べるとほっとするよ。","s":"風邪の日にお母さんがあったかいうどんを作ってくれた。"},{"t":"そば","r":"そば","d":"そば粉からつくる細い食べもので、京都ではにしんそばが有名だよ。","s":"おじいちゃんとそば屋さんでざるそばを食べた。"},{"t":"天ぷら","r":"てんぷら","d":"野菜やエビに衣をつけてカラッと揚げた料理で、サクサクでおいしいよ。","s":"揚げたての天ぷらがサクサクでおいしかった。"},{"t":"寿司","r":"すし","d":"お酢で味つけしたごはんの上にお魚をのせた、日本を代表する食べものだよ。","s":"誕生日のお祝いに回転寿司に行った。"},{"t":"おもち","r":"おもち","d":"もち米をついて作るやわらかい食べもので、お正月にはかかせないよ。","s":"お正月にのびるおもちをたくさん食べた。"},{"t":"ぜんざい","r":"ぜんざい","d":"あまいあずきの汁におもちを入れたあったかいデザートで、冬にぴったりだよ。","s":"寒い日にお母さんがぜんざいを作ってくれた。"},{"t":"わらび餅","r":"わらびもち","d":"プルプルとした食感のすずしいお菓子で、きな粉をかけて食べるとおいしいよ。","s":"暑い日に冷たいわらび餅を買ってもらった。"},{"t":"鯖寿司","r":"さばずし","d":"脂ののった鯖を使った押し寿司で、京都の伝統的な味だよ。","s":"お祭りの日にお母さんが鯖寿司を作った。"},{"t":"にしんそば","r":"にしんそば","d":"甘く煮たにしんをおそばにのせた京都の名物料理だよ。","s":"京都の老舗のにしんそばがおいしかった。"},{"t":"千枚漬け","r":"せんまいづけ","d":"かぶをうすーく切ってつけた京都の冬の漬物で、上品な味がするよ。","s":"冬になるとおばあちゃんが千枚漬けを漬ける。"},{"t":"生麩","r":"なまふ","d":"もちもちした食感の食べもので、京都ではお料理にもお菓子にも使われるよ。","s":"もちもちの生麩をおみそ汁に入れて食べた。"},{"t":"懐石料理","r":"かいせきりょうり","d":"季節の食材をうつくしく盛りつけた日本の伝統的なコース料理だよ。","s":"お祝いの日に懐石料理をいただいた。"},{"t":"湯葉","r":"ゆば","d":"豆乳をあたためたときにできるうすい膜で、とってもなめらかでおいしいよ。","s":"京都のお店で出来たての湯葉を食べた。"},{"t":"茶そば","r":"ちゃそば","d":"お茶を練りこんだ緑色のおそばで、香りがよくてさわやかな味だよ。","s":"宇治で抹茶の香りがする茶そばをすすった。"},{"t":"ちりめん山椒","r":"ちりめんざんしょう","d":"小さなじゃこと山椒をいっしょに炊いた京都のごはんのおともだよ。","s":"ちりめん山椒をあつあつのごはんにのせた。"},{"t":"柚子","r":"ゆず","d":"さわやかな香りのする柑橘で、料理の香りづけやゆず湯に使われるよ。","s":"冬至の日に柚子を浮かべたお風呂に入った。"},{"t":"鹿","r":"しか","d":"奈良公園が有名だけど、京都の山にもいる、やさしい目をした動物だよ。","s":"奈良公園で鹿にせんべいをあげた。"},{"t":"亀","r":"かめ","d":"長生きの象徴で、神社の池でのんびり甲羅干しをしているのを見かけるよ。","s":"池のほとりで亀が甲羅干しをしていた。"},{"t":"鯉","r":"こい","d":"お寺や神社の池をゆうゆうと泳ぐ大きな魚で、色とりどりでうつくしいよ。","s":"池の鯉にパンくずを投げたら寄ってきた。"},{"t":"つばめ","r":"つばめ","d":"春になるとやってきて軒先に巣をつくる鳥で、すばやく飛ぶ姿がかっこいいよ。","s":"軒下につばめが巣を作って子育てしていた。"},{"t":"すずめ","r":"すずめ","d":"チュンチュンとないて街なかにもいる小さな鳥で、とても身近な存在だよ。","s":"すずめが屋根の上でチュンチュン鳴いている。"},{"t":"梅","r":"うめ","d":"まだ寒い早春にさく花で、いい香りがして春がくることを教えてくれるよ。","s":"北野天満宮の梅が春一番に咲いていた。"},{"t":"藤","r":"ふじ","d":"むらさき色の花がすだれのように垂れさがる、とてもうつくしい花だよ。","s":"お寺の藤棚から紫の花が垂れ下がっていた。"},{"t":"菊","r":"きく","d":"秋に咲く日本を代表する花で、皇室の紋章にもなっているよ。","s":"おじいちゃんが丹精こめて育てた菊が咲いた。"},{"t":"杉","r":"すぎ","d":"まっすぐ高くのびる木で、京都の北山杉はとくに美しいことで有名だよ。","s":"山道の両側に大きな杉がまっすぐ立っていた。"},{"t":"しだれ桜","r":"しだれざくら","d":"枝がやわらかく垂れさがる桜で、まるで花のカーテンみたいだよ。","s":"春のしだれ桜が風にゆれてきれいだった。"},{"t":"紫陽花","r":"あじさい","d":"梅雨の時期にさく花で、青やむらさき、ピンクに色がかわるのがふしぎだよ。","s":"雨の日にお寺の紫陽花が色づいていた。"},{"t":"蛍","r":"ほたる","d":"夏の夜にお尻を光らせて飛ぶ虫で、鴨川のちかくでも見られることがあるよ。","s":"夏の夜に川のそばで蛍の光を見つけた。"},{"t":"竹","r":"たけ","d":"すくすくまっすぐ伸びる植物で、かごやざるなどいろんなものに使われるよ。","s":"嵐山の竹林をさらさらと風が吹き抜けた。"},{"t":"萩","r":"はぎ","d":"秋の七草のひとつで、小さなむらさき色の花がたくさん咲くかわいい植物だよ。","s":"お寺の庭で萩の花が秋風にゆれていた。"},{"t":"睡蓮","r":"すいれん","d":"水の上にうかぶように咲く花で、お寺の池でよく見かけるよ。","s":"池一面に睡蓮の花が静かに浮かんでいた。"},{"t":"山茶花","r":"さざんか","d":"冬の寒い時期にも元気に咲く花で、垣根によく植えられているよ。","s":"冬の垣根に赤い山茶花の花が咲いていた。"},{"t":"柳","r":"やなぎ","d":"細い枝が風にゆれるすがたが美しい木で、川のほとりによく植えられているよ。","s":"川沿いの柳が風にさらさらゆれていた。"},{"t":"桔梗","r":"ききょう","d":"むらさき色の星の形をした花で、昔からお寺のお庭に植えられてきたよ。","s":"庭に咲いた桔梗の紫色がとてもきれいだった。"},{"t":"百合","r":"ゆり","d":"大きくて香りのよい花で、白い百合はとくに気品があるよ。","s":"百合の花のあまい香りが風に乗ってきた。"},{"t":"鶴","r":"つる","d":"長生きの象徴とされる美しい鳥で、折り紙でもよく折られるよ。","s":"折り紙で金色の鶴を折っておばあちゃんにあげた。"},{"t":"うぐいす","r":"うぐいす","d":"「ホーホケキョ」と美しい声でなく鳥で、春を告げる鳥として親しまれているよ。","s":"春の朝にうぐいすの鳴き声が聞こえた。"},{"t":"風情","r":"ふぜい","d":"なんとも言えない味わい深いようすのことで、京都の街にはこれがたっぷりあるよ。","s":"雪の降った京都の町並みに風情を感じた。"},{"t":"趣","r":"おもむき","d":"しみじみとした味わいや感じのことで、古い建物や庭園に感じるよ。","s":"苔むした石段のあるお寺に趣を感じた。"},{"t":"粋","r":"いき","d":"さりげなくかっこいいようすのことで、おしゃれの最上級みたいな意味だよ。","s":"おじいちゃんの着物姿はとても粋だった。"},{"t":"雅","r":"みやび","d":"上品でうつくしいようすのことで、平安時代の貴族の世界を思わせるよ。","s":"十二単を着たお姫さまの姿がとても雅だった。"},{"t":"わびさび","r":"わびさび","d":"シンプルで静かなものの中に美しさを見つける、日本ならではの考え方だよ。","s":"苔むした古い茶室にわびさびを感じた。"},{"t":"古風","r":"こふう","d":"昔ながらのやり方やようすのことで、京都の街にぴったりの言葉だよ。","s":"おばあちゃんの家は古風な造りで落ち着く。"},{"t":"凛","r":"りん","d":"きりっとして気高いようすのことで、冬の朝の空気みたいな感じだよ。","s":"冬の朝の冷たい空気が凛として気持ちよかった。"},{"t":"奥ゆかしい","r":"おくゆかしい","d":"ひかえめだけど深い魅力があるようすのことで、日本人が大切にする美しさだよ。","s":"着物姿のその人はとても奥ゆかしい雰囲気だった。"},{"t":"ひっそり","r":"ひっそり","d":"しずかでめだたないようすのことで、京都の路地裏にはひっそりした名店があるよ。","s":"路地の奥にひっそりと小さなお寺があった。"},{"t":"たたずまい","r":"たたずまい","d":"建物や人のそこにある雰囲気やようすのことで、京都のお寺のたたずまいは格別だよ。","s":"古いお寺のたたずまいに思わず足を止めた。"},{"t":"しっとり","r":"しっとり","d":"おちついてしずかな雰囲気のことで、雨の日の京都はしっとりしてすてきだよ。","s":"雨上がりの庭がしっとりとぬれていた。"},{"t":"はんなり","r":"はんなり","d":"はなやかでやわらかいようすを表す京都ならではの言葉で、舞妓さんの雰囲気にぴったりだよ。","s":"はんなりとした色合いの着物がよく似合っていた。"},{"t":"ほのか","r":"ほのか","d":"かすかでうっすらとしたようすのことで、お香のほのかな香りなどに使うよ。","s":"ほのかに金木犀の香りがただよってきた。"},{"t":"風雅","r":"ふうが","d":"上品で趣のあるようすのことで、和歌やお茶の世界によく使われる言葉だよ。","s":"お茶室に生けられた一輪の花が風雅だった。"},{"t":"情緒","r":"じょうちょ","d":"しみじみとした味わいのある雰囲気のことで、京都の街にはあふれているよ。","s":"一乗寺の夕暮れは情緒があるね。"},{"t":"閑静","r":"かんせい","d":"しずかでおだやかなようすのことで、一乗寺あたりは閑静な住宅街が広がるよ。","s":"一乗寺の裏通りは閑静で落ち着く。"},{"t":"優美","r":"ゆうび","d":"しなやかでうつくしいようすのことで、日本舞踊のうごきを表すのにぴったりだよ。","s":"詩仙堂の庭に優美な花が咲いていた。"},{"t":"清楚","r":"せいそ","d":"清らかでさっぱりしたうつくしさのことで、白い花のような印象だよ。","s":"京都のお寺に清楚な白い花が咲いていた。"},{"t":"典雅","r":"てんが","d":"格式が高くて上品なうつくしさのことで、宮中の行事のような感じだよ。","s":"一乗寺のお寺で典雅なお琴の音が聞こえた。"},{"t":"荘厳","r":"そうごん","d":"おごそかでりっぱなようすのことで、大きなお寺に入ったときに感じるよ。","s":"一乗寺のお寺の本堂は荘厳な空気だった。"},{"t":"幽玄","r":"ゆうげん","d":"奥深くてことばでは言い表せないような美しさのことで、能の世界に通じるよ。","s":"京都の竹林に幽玄な光が差し込んだ。"},{"t":"厳か","r":"おごそか","d":"きちんとしていて気持ちが引きしまるようすで、神社の儀式などで使うよ。","s":"一乗寺のお あさやけ","d":"朝はやくに空がピンクやオレンジに色づくこと。","s":"早起きしたら空がきれいな朝焼けだった。"},{"t":"山","r":"やま","d":"土や岩がもりあがって、高くそびえているところのこと。","s":"みんなで山に登ってお弁当を食べた。"},{"t":"川","r":"かわ","d":"山から海にむかって、水がさらさら流れているところのこと。","s":"夏休みに川で石を投げて水切りをした。"},{"t":"海","r":"うみ","d":"しょっぱい水がいっぱいの、とっても広い青い世界のこと。","s":"夏休みに家族で海に泳ぎに行った。"},{"t":"湖","r":"みずうみ","d":"山の中などにある、まわりを陸でかこまれた大きな水たまりのこと。","s":"静かな湖の上をボートでゆっくりこいだ。"},{"t":"森","r":"もり","d":"木がたくさん生えていて、うっそうとした緑の場所のこと。","s":"森の中はひんやりして涼しかった。"},{"t":"林","r":"はやし","d":"木が何本もならんで生えている場所のこと。森よりすこし明るいよ。","s":"林の中でカブトムシを見つけた。"},{"t":"花","r":"はな","d":"植物がさかせる、色とりどりのきれいな部分のこと。","s":"お母さんに花を摘んでプレゼントした。"},{"t":"木","r":"き","d":"地面から生えて、枝や葉っぱをひろげている大きな植物のこと。","s":"校庭の大きな木の下でお弁当を食べた。"},{"t":"草","r":"くさ","d":"地面にぴたっと生えている、緑の小さい植物のこと。","s":"草の上に寝転んで雲の形を眺めた。"},{"t":"葉っぱ","r":"はっぱ","d":"木や草についている、緑のひらひらした部分のこと。","s":"秋になると葉っぱが赤や黄色になる。"},{"t":"石","r":"いし","d":"地面にころがっている、かたくてかたまったもののこと。","s":"川できれいな石を拾ってポケットに入れた。"},{"t":"砂","r":"すな","d":"石がこなごなになった、さらさらした小さなつぶのこと。","s":"公園の砂場で大きな砂のお城を作って遊んだ。"},{"t":"土","r":"つち","d":"地面をつくっている、茶色でやわらかいもののこと。","s":"花だんの土を掘って虫を探した。"},{"t":"水","r":"みず","d":"コップに入れたり川に流れたりする、とうめいな液体のこと。","s":"のどがかわいて冷たい水を飲んだ。"},{"t":"火","r":"ひ","d":"めらめらと燃えている、あかるくてあつい光のこと。","s":"キャンプでお父さんと一緒に火をおこした。"},{"t":"氷","r":"こおり","d":"水がこおって、カチカチにかたまったもののこと。","s":"コップの中で氷がカランと鳴った。"},{"t":"春","r":"はる","d":"さくらが咲いてあたたかくなる、新しいスタートの季節のこと。","s":"春になるとチューリップが咲き始める。"},{"t":"夏","r":"なつ","d":"太陽がぎらぎら照って、プールや海が楽しいあつい季節のこと。","s":"今年の夏は毎日プールに行った。"},{"t":"秋","r":"あき","d":"葉っぱが赤や黄色に色づいて、すずしくなる季節のこと。","s":"秋になって公園の落ち葉を集めた。"},{"t":"冬","r":"ふゆ","d":"雪がふって寒くなる、こたつやお鍋がうれしい季節のこと。","s":"冬になったら雪だるまを作りたい。"},{"t":"つくし","r":"つくし","d":"春になると野原からにょきっと出てくる、かわいい植物のこと。","s":"土手でつくしをたくさん摘んだ。"},{"t":"たんぽぽ","r":"たんぽぽ","d":"春に黄色い花をさかせて、わたげを飛ばす野の花のこと。","s":"たんぽぽの綿毛をふうっと飛ばした。"},{"t":"さくら","r":"さくら","d":"春にピンクの花をたくさんさかせる、日本の春をつげる木のこと。","s":"今年もさくらがきれいに咲いた。"},{"t":"どんぐり","r":"どんぐり","d":"秋にカシやナラの木から落ちてくる、小さいまるい実のこと。","s":"公園でどんぐりをたくさん拾った。"},{"t":"犬","r":"いぬ","d":"人間のいちばんの友だちで、しっぽをふってよろこぶ動物のこと。","s":"毎朝、犬と一緒に散歩している。"},{"t":"猫","r":"ねこ","d":"にゃーと鳴いて、ふわふわの毛がきもちいいペットのこと。","s":"塀の上で猫がひなたぼっこしている。"},{"t":"うさぎ","r":"うさぎ","d":"長い耳とまんまるのしっぽがかわいい、ぴょんぴょんはねる動物のこと。","s":"学校でうさぎのお世話をしている。"},{"t":"ハムスター","r":"はむすたー","d":"ほっぺに食べものをつめこむ、手のひらサイズの小さな動物のこと。","s":"ハムスターが回し車で走っている。"},{"t":"鳥","r":"とり","d":"空をとぶことができる、つばさのある動物のこと。","s":"朝早く窓の外で鳥がさえずっている。"},{"t":"金魚","r":"きんぎょ","d":"お祭りの金魚すくいでおなじみの、赤くてきれいなお魚のこと。","s":"夏祭りの金魚すくいで三匹もとれた。"},{"t":"カメ","r":"かめ","d":"硬いこうらを背おって、ゆっくり歩く動物のこと。","s":"飼っているカメがレタスを食べた。"},{"t":"カエル","r":"かえる","d":"けろけろと鳴いて、ぴょんとジャンプする生きもののこと。","s":"雨の日にカエルが道に出てきた。"},{"t":"ゾウ","r":"ぞう","d":"長い鼻と大きい体をもつ、陸でいちばん大きい動物のこと。","s":"動物園でゾウに水をかけられた。"},{"t":"キリン","r":"きりん","d":"首がとっても長くて、高い木の葉っぱを食べる動物のこと。","s":"動物園で背の高いキリンにえさをあげた。"},{"t":"ライオン","r":"らいおん","d":"たてがみがかっこいい、百獣の王とよばれる動物のこと。","s":"動物園のライオンが大きなあくびをした。"},{"t":"トラ","r":"とら","d":"黄色と黒のしまもようがかっこいい、強い動物のこと。","s":"動物園のトラが低い声でうなっていた。"},{"t":"クマ","r":"くま","d":"森にすんでいる大きくて力持ちの動物で、はちみつが好きだよ。","s":"ぬいぐるみのクマを抱いて寝ている。"},{"t":"パンダ","r":"ぱんだ","d":"白と黒のもようがかわいくて、笹を食べるのが好きな動物のこと。","s":"パンダの赤ちゃんが転がって遊んでいた。"},{"t":"サル","r":"さる","d":"木登りが得意で、人間ににた顔をしている動物のこと。","s":"サルの親子が木の上で毛づくろいしていた。"},{"t":"ペンギン","r":"ぺんぎん","d":"よちよち歩くけど泳ぎは得意な、タキシードみたいな鳥のこと。","s":"ペンギンが列を作って歩いていた。"},{"t":"イルカ","r":"いるか","d":"海でぴょんとジャンプする、頭がよくてやさしい動物のこと。","s":"水族館でイルカが高くジャンプするのを見た。"},{"t":"クジラ","r":"くじら","d":"海にすむ世界でいちばん大きな動物のこと。","s":"クジラが海から大きくジャンプした。"},{"t":"タコ","r":"たこ","d":"足が8本あって、海の中にすんでいる生きもののこと。","s":"海でタコを見つけてびっくりした。"},{"t":"カニ","r":"かに","d":"はさみのような手を持っていて、横歩きをする生きもののこと。","s":"砂浜で小さなカニが横歩きしていた。"},{"t":"チョウ","r":"ちょう","d":"きれいなもようの羽で、花から花へひらひらとぶ虫のこと。","s":"きれいなチョウが花の蜜を吸っている。"},{"t":"テントウムシ","r":"てんとうむし","d":"赤い体に黒い水玉もようがついた、小さくてまるい虫のこと。","s":"指の上にテントウムシがとまった。"},{"t":"カブトムシ","r":"かぶとむし","d":"りっぱなツノがかっこいい、夏に人気の大きな虫のこと。","s":"夏休みにカブトムシを捕まえた。"},{"t":"セミ","r":"せみ","d":"夏になるとミーンミーンと元気に鳴く虫のこと。","s":"セミが朝から元気に鳴いている。"},{"t":"トンボ","r":"とんぼ","d":"すーっとまっすぐ飛んで、空中でぴたっと止まれる虫のこと。","s":"赤いトンボが田んぼの上を飛んでいる。"},{"t":"ホタル","r":"ほたる","d":"夏の夜にお尻がぴかぴか光る、すてきな虫のこと。","s":"夏の夜にホタルの光を見に行った。"},{"t":"アリ","r":"あり","d":"小さい体で列をつくって、えさをはこぶ働き者の虫のこと。","s":"アリが行列を作ってえさを運んでいる。"},{"t":"ミツバチ","r":"みつばち","d":"花のみつを集めて、おいしいハチミツをつくる虫のこと。","s":"ミツバチが花の周りを飛んでいる。"},{"t":"ネズミ","r":"ねずみ","d":"小さくてすばしっこい、チューチュー鳴く動物のこと。","s":"物置の奥からネズミがちょろちょろ走り出た。"},{"t":"リス","r":"りす","d":"ふさふさのしっぽで木を走りまわる、どんぐりが大好きな動物のこと。","s":"リスが木の実をほおばっていた。"},{"t":"コアラ","r":"こあら","d":"ユーカリの木にしがみついて、いつもねむそうな動物のこと。","s":"コアラが木の上でぐっすり眠っていた。"},{"t":"ヒツジ","r":"ひつじ","d":"もこもこの白い毛がふわふわで、メーメーと鳴く動物のこと。","s":"牧場でふわふわのヒツジにえさをあげた。"},{"t":"ウマ","r":"うま","d":"走るのがとっても速くて、人をのせてくれる大きな動物のこと。","s":"牧場で初めてウマに乗せてもらった。"},{"t":"ブタ","r":"ぶた","d":"ブーブーと鳴いて、まるくてピンクの鼻がかわいい動物のこと。","s":"ブタが泥んこの中で転がっていた。"},{"t":"ニワトリ","r":"にわとり","d":"朝にコケコッコーと鳴いておこしてくれる、たまごをうむ鳥のこと。","s":"朝早くニワトリがコケコッコーと鳴いた。"},{"t":"アヒル","r":"あひる","d":"ガーガーと鳴いて、よちよち歩くすがたがかわいい鳥のこと。","s":"池でアヒルが気持ちよさそうに泳いでいた。"},{"t":"スズメ","r":"すずめ","d":"茶色くて小さくて、町のどこにでもいるチュンチュン鳴く鳥のこと。","s":"屋根の上にスズメが並んでいる。"},{"t":"カラス","r":"からす","d":"黒い体でカーカーと鳴く、とても頭がいい鳥のこと。","s":"ゴミ置き場にカラスが来て困っている。"},{"t":"フクロウ","r":"ふくろう","d":"夜にホーホーと鳴く、くりくりお目めの鳥のこと。","s":"夜の森でフクロウの声が聞こえた。"},{"t":"ダンゴムシ","r":"だんごむし","d":"さわるとまるくなる、石の下にいる小さな虫のこと。","s":"石の下にダンゴムシがいっぱいいた。"},{"t":"赤","r":"あか","d":"りんごやトマトの色で、信号では「止まれ」のしるしだよ。","s":"赤いチューリップが花だんにさいていた。"},{"t":"青","r":"あお","d":"空や海みたいな色で、さわやかで気持ちいい色のこと。","s":"青い空にまっすぐなひこうき雲が見えた。"},{"t":"黄色","r":"きいろ","d":"バナナやひまわりみたいに、ぱっと目立つ明るい色のこと。","s":"黄色いちょうちょが飛んできた。"},{"t":"緑","r":"みどり","d":"葉っぱや草の色で、自然がいっぱいなイメージの色のこと。","s":"校庭の木の緑の葉っぱがゆれている。"},{"t":"白","r":"しろ","d":"雪やうさぎみたいな色で、なにもまざっていないきれいな色のこと。","s":"動物園で白いうさぎを抱っこした。"},{"t":"黒","r":"くろ","d":"夜の空やカラスの体みたいな、いちばん暗い色のこと。","s":"黒いねこが塀の上を歩いていた。"},{"t":"ピンク","r":"ぴんく","d":"さくらやフラミンゴみたいな、やさしくてかわいい色のこと。","s":"ピンクの花が道ばたにさいている。"},{"t":"オレンジ","r":"おれんじ","d":"みかんや夕焼けみたいな、あたたかくて元気な色のこと。","s":"オレンジのジュースをこぼしちゃった。"},{"t":"むらさき","r":"むらさき","d":"ぶどうやラベンダーみたいな、赤と青をまぜた色のこと。","s":"庭のむらさきのあさがおが咲いた。"},{"t":"茶色","r":"ちゃいろ","d":"チョコレートや土みたいな、ぬくもりのある色のこと。","s":"公園で茶色い子犬が走ってきた。"},{"t":"はいいろ","r":"はいいろ","d":"白と黒のあいだくらいの色で、くもりの日の空みたいな色のこと。","s":"空いっぱいにはいいろの雲が広がった。"},{"t":"金色","r":"きんいろ","d":"きんぴかに光っていて、とくべつでごうかな色のこと。","s":"金色のメダルをもらって飛び上がった。"},{"t":"銀色","r":"ぎんいろ","d":"きらりと光っていて、すずしくてかっこいい色のこと。","s":"銀色の折り紙でキラキラの星を作った。"},{"t":"水色","r":"みずいろ","d":"空や水みたいな、うすくてさわやかな青のこと。","s":"水色のワンピースを買ってもらった。"},{"t":"丸","r":"まる","d":"ボールやお月さまみたいに、まるくなった形のこと。","s":"クレヨンで画用紙に大きな丸を描いた。"},{"t":"三角","r":"さんかく","d":"おにぎりや三角定規みたいに、かどが3つある形のこと。","s":"おにぎりを三角にぎゅっとにぎった。"},{"t":"四角","r":"しかく","d":"箱やノートみたいに、かどが4つある形のこと。","s":"折り紙をきれいな四角に折った。"},{"t":"星形","r":"ほしがた","d":"お星さまみたいに、とんがりが何個かある形のこと。","s":"お母さんと星形のクッキーを焼いた。"},{"t":"ハート","r":"はーと","d":"だいすきの気持ちをあらわす、ぷっくりした形のこと。","s":"カードにハートをたくさん描いた。"},{"t":"丸い","r":"まるい","d":"ボールやお月さまみたいに、まんまるな様子のこと。","s":"河原で丸い石を拾って水に投げた。"},{"t":"四角い","r":"しかくい","d":"箱みたいに、かどがあってしかくい様子のこと。","s":"四角い箱にプレゼントを入れた。"},{"t":"細長い","r":"ほそながい","d":"ほそくて長い形のこと。えんぴつやストローは細長いね。","s":"細長いぼうで地面に絵を描いた。"},{"t":"まんまる","r":"まんまる","d":"丸よりもっとまるくて、ぱんぱんにまるい様子のこと。","s":"お月さまがまんまるに光っている。"},{"t":"でっかい","r":"でっかい","d":"すごく大きいことを元気よくいうときの言い方だよ。","s":"公園ででっかいすべり台を見つけた。"},{"t":"ちっちゃい","r":"ちっちゃい","d":"すごく小さいことをかわいくいうときの言い方だよ。","s":"ちっちゃいカエルを手に乗せた。"},{"t":"ぺったんこ","r":"ぺったんこ","d":"ぺちゃんとつぶれて、たいらになっている様子のこと。","s":"座ったら風船がぺったんこにつぶれた。"},{"t":"真っ赤","r":"まっか","d":"これ以上ないくらい赤い、まっかっかな様子のこと。","s":"きれいな夕やけ空が真っ赤にそまった。"},{"t":"真っ白","r":"まっしろ","d":"よごれがまったくない、まっしろしろな様子のこと。","s":"雪が降って庭が真っ白になった。"},{"t":"真っ黒","r":"まっくろ","d":"すみをぬったように、まっくろくろな様子のこと。","s":"泥んこあそびで手が真っ黒になった。"},{"t":"とうめい","r":"とうめい","d":"むこう側がすけて見えること。ガラスや水はとうめいだね。","s":"とうめいなコップに水を入れた。"},{"t":"うれしい","r":"うれしい","d":"いいことがあって、心がぱあっとあかるくなる気持ちのこと。","s":"お誕生日プレゼントがうれしい。"},{"t":"悲しい","r":"かなしい","d":"つらいことがあって、涙が出そうになる気持ちのこと。","s":"仲よしのともだちが転校して悲しい。"},{"t":"楽しい","r":"たのしい","d":"わくわくして、ずっとこうしていたいなと思う気持ちのこと。","s":"みんなでかくれんぼをするのが楽しい。"},{"t":"さびしい","r":"さびしい","d":"ひとりぼっちで、だれかにそばにいてほしい気持ちのこと。","s":"お母さんが出かけるとさびしい。"},{"t":"はずかしい","r":"はずかしい","d":"顔が赤くなって、みんなに見られたくない気持ちのこと。","s":"みんなの前で歌うのがはずかしい。"},{"t":"くやしい","r":"くやしい","d":"まけたりしっぱいしたりして、もう一回がんばりたい気持ちのこと。","s":"あと少しで勝てたのにくやしい。"},{"t":"なつかしい","r":"なつかしい","d":"むかしのことを思い出して、あったかい気持ちになること。","s":"前に住んでいた町がなつかしい。"},{"t":"安心","r":"あんしん","d":"こわいことや心配がなくなって、ほっとする気持ちのこと。","s":"お母さんが来てくれて安心した。"},{"t":"不安","r":"ふあん","d":"これからどうなるかわからなくて、心がもやもやする気持ちのこと。","s":"明日の発表会のことを思うと不安だ。"},{"t":"心配","r":"しんぱい","d":"だいじょうぶかなと気になって、落ちつかない気持ちのこと。","s":"けがをした友だちのことが心配だ。"},{"t":"たいくつ","r":"たいくつ","d":"やることがなくて、なんだかひまで面白くない気持ちのこと。","s":"雨の日は外に出られなくてたいくつだ。"},{"t":"びっくり","r":"びっくり","d":"思ってもみないことが起きて、おどろいた気持ちのこと。","s":"急に猫が飛び出してびっくりした。"},{"t":"がっかり","r":"がっかり","d":"たのしみにしていたのに、うまくいかなくてしょんぼりすること。","s":"遠足が中止になってがっかりした。"},{"t":"しょんぼり","r":"しょんぼり","d":"元気がなくなって、肩を落としている様子のこと。","s":"しかられてしょんぼりうつむいた。"},{"t":"ごきげん","r":"ごきげん","d":"にこにこして、とっても気分がいい様子のこと。","s":"おやつを食べて妹がごきげんだ。"},{"t":"勇気","r":"ゆうき","d":"こわくても「やるぞ！」と思える、強い心のこと。","s":"勇気を出して発表に手をあげた。"},{"t":"やる気","r":"やるき","d":"がんばろう！と思える、前向きな気持ちのこと。","s":"朝ごはんを食べたらやる気が出た。"},{"t":"笑顔","r":"えがお","d":"にこっとわらった、みんなを元気にするすてきな顔のこと。","s":"先生の笑顔を見るとほっとする。"},{"t":"涙","r":"なみだ","d":"泣いたときに目からぽろぽろ出てくる、しずくのこと。","s":"感動して涙がぽろっとこぼれた。"},{"t":"怒り","r":"いかり","d":"ひどいことをされて、むかっとする気持ちのこと。","s":"ずるをされて怒りがこみ上げた。"},{"t":"喜び","r":"よろこび","d":"うれしいことがあったときの、心がはずむ気持ちのこと。","s":"テストに受かって喜びでジャンプした。"},{"t":"やきもち","r":"やきもち","d":"好きな人がほかの人と仲よくしていて、いやだなと思う気持ちのこと。","s":"妹ばかりかまわれてやきもちを焼いた。"},{"t":"すっきり","r":"すっきり","d":"もやもやがなくなって、気持ちが晴れた様子のこと。","s":"部屋をかたづけたらすっきりした。"},{"t":"うんざり","r":"うんざり","d":"もういやだなあと思って、あきあきしている気持ちのこと。","s":"毎日の宿題にうんざりしている。"},{"t":"にっこり","r":"にっこり","d":"やさしく静かにほほえむ、あたたかい笑顔のこと。","s":"おじいちゃんがにっこり笑った。"},{"t":"あこがれ","r":"あこがれ","d":"すてきな人やものに「ああなりたいな」と思う気持ちのこと。","s":"サッカー選手にあこがれている。"},{"t":"ときめき","r":"ときめき","d":"すてきなことに出会って、胸がきゅんとする気持ちのこと。","s":"新しいクラスの初日はときめきでいっぱいだ。"},{"t":"感謝","r":"かんしゃ","d":"だれかにしてもらったことを「ありがとう」と思う気持ちのこと。","s":"いつも助けてくれる友だちに感謝した。"},{"t":"誇り","r":"ほこり","d":"じぶんやだれかのことを「すごいな」とうれしく思う気持ちのこと。","s":"一生けんめいがんばった自分を誇りに思う。"},{"t":"思いやり","r":"おもいやり","d":"ほかの人の気持ちを考えて、やさしくする心のこと。","s":"友だちの思いやりがうれしかった。"},{"t":"きんちょう","r":"きんちょう","d":"ドキドキして、体がかたくなっちゃう気持ちのこと。","s":"発表の順番が近づいてきんちょうした。"},{"t":"わがまま","r":"わがまま","d":"じぶんのやりたいことばかりいって、人のことを考えないこと。","s":"おもちゃ売り場でわがままを言った。"},{"t":"つらい","r":"つらい","d":"心がぎゅうっと苦しくて、がまんするのが大変な気持ちのこと。","s":"マラソンの練習で走るのがつらい。"},{"t":"ありがたい","r":"ありがたい","d":"だれかのやさしさに「うれしいな」としみじみ思う気持ちのこと。","s":"手伝ってくれるのはありがたい。"},{"t":"たのもしい","r":"たのもしい","d":"この人がいれば安心だなと思える、しっかりした様子のこと。","s":"困ったとき助けてくれるお兄ちゃんはたのもしい。"},{"t":"せつない","r":"せつない","d":"胸がきゅっとなる、ちょっとかなしくてあまい気持ちのこと。","s":"転校する友だちを見送るのがせつない。"},{"t":"ほっこり","r":"ほっこり","d":"心がぽかぽかして、やさしい気持ちになること。","s":"あったかいスープでほっこりした。"},{"t":"のんき","r":"のんき","d":"あわてないで、のーんびりかまえている様子のこと。","s":"弟はいつものんきに歌っている。"},{"t":"あせり","r":"あせり","d":"はやくしなきゃと思って、心がざわざわする気持ちのこと。","s":"テストの時間が足りなくてあせりを感じた。"},{"t":"ほのぼの","r":"ほのぼの","d":"見ていると気持ちがあたたかくなるような、やわらかい様子のこと。","s":"親子のねこがひなたぼっこしていてほのぼのする。"},{"t":"おにぎり","r":"おにぎり","d":"ごはんを手でにぎって作る、三角や丸い形の食べ物だよ。","s":"遠足の日におにぎりを三つも食べた。"},{"t":"たまごやき","r":"たまごやき","d":"たまごをといて、フライパンでくるくる巻きながら焼いた料理だよ。","s":"お母さんのたまごやきが大好きだ。"},{"t":"カレーライス","r":"かれーらいす","d":"スパイスのきいたルーをごはんにかけて食べる、みんな大好きな料理だよ。","s":"今日の給食はカレーライスだった。"},{"t":"お寿司","r":"おすし","d":"すめしの上にお魚などをのせた、日本のごちそうだよ。","s":"回転ずしでお寿司をたくさん食べた。"},{"t":"ハンバーグ","r":"はんばーぐ","d":"ひき肉をこねて丸く焼いた、子どもに人気のおかずだよ。","s":"ハンバーグをこねるのを手伝った。"},{"t":"からあげ","r":"からあげ","d":"とり肉に味をつけて油であげた、カリカリでジューシーな食べ物だよ。","s":"運動会でからあげをたくさん食べた。"},{"t":"コロッケ","r":"ころっけ","d":"じゃがいもやお肉をまぜて、パン粉をつけて揚げた食べ物だよ。","s":"ほかほかのコロッケを買って帰った。"},{"t":"サラダ","r":"さらだ","d":"新鮮な野菜をお皿にもって、ドレッシングをかけて食べる料理だよ。","s":"畑でとれた野菜でサラダを作った。"},{"t":"みそしる","r":"みそしる","d":"おみそをといたあたたかいスープで、朝ごはんによく出るよ。","s":"あったかいみそしるをふうふう飲んだ。"},{"t":"パン","r":"ぱん","d":"小麦粉をこねてオーブンで焼いた、ふわふわの食べ物だよ。","s":"焼きたてのパンのにおいがする。"},{"t":"ケーキ","r":"けーき","d":"スポンジにクリームやフルーツをかざった、おたんじょう日のおかしだよ。","s":"誕生日のケーキにろうそくを立てた。"},{"t":"アイスクリーム","r":"あいすくりーむ","d":"ミルクやさとうを冷たくかためた、夏にうれしいおかしだよ。","s":"暑い日にアイスクリームを食べた。"},{"t":"チョコレート","r":"ちょこれーと","d":"カカオから作られた、あまくてとろけるおかしだよ。","s":"バレンタインにチョコレートを作った。"},{"t":"クッキー","r":"くっきー","d":"小麦粉とバターで作って焼いた、サクサクのおかしだよ。","s":"友だちの家でクッキーを一緒に焼いた。"},{"t":"プリン","r":"ぷりん","d":"たまごと牛乳で作った、ぷるぷるしたあまいおかしだよ。","s":"冷蔵庫のプリンをこっそり食べた。"},{"t":"ゼリー","r":"ぜりー","d":"果物のしるをかためた、つるんと /* ── Park zone (一乗寺公園) ── */
var PARK_CENTER=[35.0422989,135.7871945];
var PARK_BOUNDS=[
  [35.0429519,135.7868887],
  [35.0429449,135.7873092],
  [35.0429489,135.7878188],
  [35.0429043,135.787872],
  [35.0424507,135.7878337],
  [35.0415857,135.7877913],
  [35.0415401,135.7876949],
  [35.0415746,135.7869094],
  [35.0419565,135.7866844],
  [35.0419812,135.7863771],
  [35.0422493,135.7865141],
  [35.0424981,135.7866404]
];
var PARK_LAT_MIN=35.0415401,PARK_LAT_MAX=35.0429519;
var PARK_LNG_MIN=135.7863771,PARK_LNG_MAX=135.787872;

function pointInPoly(lat,lng,poly){
  var inside=false;
  for(var i=0,j=poly.length-1;i<poly.length;j=i++){
    var yi=poly[i][0],xi=poly[i][1];
    var yj=poly[j][0],xj=poly[j][1];
    if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))
      inside=!inside;
  }
  return inside;
}
function inPark(lat,lng){
  if(lat<PARK_LAT_MIN||lat>PARK_LAT_MAX||lng<PARK_LNG_MIN||lng>PARK_LNG_MAX)return false;
  return pointInPoly(lat,lng,PARK_BOUNDS);
}
/* Check if a word's bounding box overlaps the park.
   lat,lng = marker anchor (center of text).
   charLen = number of characters, fontSize = px size.
   We check the anchor plus the four corners of the text extent. */
function wordOverlapsPark(lat,lng,charLen,fontSize){
  /* approximate pixel-to-degree at zoom 17 around Kyoto */
  var pxPerDegLat=1/(111320/Math.pow(2,17)/256);  /* ~1 degree lat in px */
  var pxPerDegLng=1/(111320*Math.cos(lat*Math.PI/180)/Math.pow(2,17)/256);
  /* word dimensions in pixels (with letter-spacing 4px) */
  var cw=fontSize*1.15;
  var tw=charLen*cw+(charLen-1)*4+24;
  var th=fontSize+20;
  /* add generous margin (40px buffer around the text) */
  var margin=40;
  var halfW=(tw/2+margin)/pxPerDegLng;  /* degrees lng */
  var halfH=(th/2+margin)/pxPerDegLat;  /* degrees lat */
  /* check corners and center against park */
  var pts=[
    [lat,lng],
    [lat+halfH,lng-halfW],[lat+halfH,lng+halfW],
    [lat-halfH,lng-halfW],[lat-halfH,lng+halfW],
    [lat,lng-halfW],[lat,lng+halfW],
    [lat+halfH,lng],[lat-halfH,lng]
  ];
  for(var i=0;i<pts.length;i++){
    if(inPark(pts[i][0],pts[i][1]))return true;
  }
  return false;
}


/* ── Helpers ── */
function rb(t,r){if(t===r)return t;return '<ruby>'+t+'<rp>(</rp><rt>'+r+'</rt><rp>)</rp></ruby>'}
function rand(a,b){return a+Math.random()*(b-a)}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;
  }
  return arr;
}
function pick(arr,n){return shuffle(arr.slice()).slice(0,Math.min(n,arr.length))}

var barEl=document.getElementById('bar');

var bdEl=document.getElementById('bd');
var sentenceEl=document.getElementById('sentence');
var curOn=null;
var markers=[];
var sentenceTimer=null;

/* ── Generate a random position for one word (avoiding park overlap) ── */
function genPosition(charLen,fontSize){
  for(var a=0;a<100;a++){
    var angle=Math.random()*Math.PI*2;
    var radius=Math.sqrt(Math.random());
    var lat=CENTER[0]+Math.cos(angle)*radius*SPREAD_LAT;
    var lng=CENTER[1]+Math.sin(angle)*radius*SPREAD_LNG;
    if(!wordOverlapsPark(lat,lng,charLen,fontSize))return [lat,lng];
  }
  /* fallback: place far from park */
  return [CENTER[0]-SPREAD_LAT*0.8,CENTER[1]+SPREAD_LNG*0.8];
}

/* ── Place words on map ── */
function placeWords(){
  /* dismiss any active state */
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
  /* remove old markers */
  markers.forEach(function(m){map.removeLayer(m)});
  markers=[];

  var nLocal=Math.round(SHOW_COUNT*0.3);
  var nGeneral=SHOW_COUNT-nLocal;
  var localPicked=pick(LOCAL,nLocal).map(function(w){return {t:w.t,r:w.r,d:w.d,s:w.s,local:true}});
  var generalPicked=pick(GENERAL,nGeneral);
  var chosen=shuffle(localPicked.concat(generalPicked));

  chosen.forEach(function(w,i){
    var s=SIZES[Math.floor(Math.random()*SIZES.length)];
    var pos=genPosition(w.t.length,s);
    var cw=s*1.15;
    var tw=w.t.length*cw+(w.t.length-1)*4;
    var cls=w.local?'w local':'w';
    var icon=L.divIcon({
      html:'<div class="'+cls+'" style="font-size:'+s+'px">'+rb(w.t,w.r)+'</div>',
      className:'',
      iconSize:[tw+24,s+20],
      iconAnchor:[(tw+24)/2,(s+20)/2]
    });
    var m=L.marker(pos,{icon:icon,interactive:true,keyboard:false,draggable:true}).addTo(map);
    m._wordData=w;

    /* stagger fade-in */
    (function(marker,word){
      setTimeout(function(){
        var el=getW(marker);
        if(el)el.classList.add('visible');
      },100+i*60);

      marker.on('mouseover',function(){if(!marker._isDragging)show(marker,word)});
      marker.on('mouseout',function(){if(!marker._isDragging)hide(marker)});
      marker.on('click',function(e){
        L.DomEvent.stopPropagation(e);
        if(curOn===getW(marker)){hide(marker)} else {show(marker,word)}
      });

      /* drag events */
      marker.on('dragstart',function(){
        marker._isDragging=true;
        hide(marker);
        var el=getW(marker);
        if(el)el.classList.add('dragging');
      });
      marker.on('dragend',function(){
        marker._isDragging=false;
        var el=getW(marker);
        if(el)el.classList.remove('dragging');
        var pos=marker.getLatLng();
        if(inPark(pos.lat,pos.lng)){
          absorbWord(marker,word);
        }
      });
    })(m,w);

    markers.push(m);
  });
}

function getW(m){return m.getElement()?m.getElement().querySelector('.w'):null}

function show(m,w){
  var el=getW(m);if(!el)return;
  if(curOn&&curOn!==el)curOn.classList.remove('on');
  curOn=el;
  el.classList.add('on');
  document.body.classList.add('focus');
  bwEl.innerHTML=rb(w.t,w.r);
  bdEl.textContent=w.d;
  barEl.classList.add('show');
}

function hide(m){
  var el=getW(m);if(!el)return;
  el.classList.remove('on');
  if(curOn===el){
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
}

map.on('click',function(){
  if(curOn){
    curOn.classList.remove('on');
    curOn=null;
    document.body.classList.remove('focus');
    barEl.classList.remove('show');
  }
  /* dismiss sentence on map click */
  sentenceEl.classList.remove('show');
});

/* ── Absorb word into park ── */
function absorbWord(marker,word){
  var el=getW(marker);
  if(!el)return;
  /* animate: move marker to park center */
  marker.setLatLng(PARK_CENTER);
  /* trigger absorb animation */
  setTimeout(function(){
    el.classList.add('absorbing');
  },50);
  /* after animation, remove marker and show sentence */
  setTimeout(function(){
    map.removeLayer(marker);
    var idx=markers.indexOf(marker);
    if(idx>-1)markers.splice(idx,1);
    showSentence(word);
  },700);
}

function showSentence(word){
  var text=word.s?word.s.replace(new RegExp(word.t,'g'),'<span class="sword">'+word.t+'</span>'):'<span class="sword">'+word.t+'</span>';
  sentenceEl.innerHTML=text;
  sentenceEl.classList.add('show');
  if(sentenceTimer)clearTimeout(sentenceTimer);
  sentenceTimer=setTimeout(function(){
    sentenceEl.classList.remove('show');
  },4500);
}

/* ── Shuffle button ── */
document.getElementById('shuffle').addEventListener('click',function(e){
  e.stopPropagation();
  placeWords();
});

/* ── Initial placement ── */
placeWords();
</script>
